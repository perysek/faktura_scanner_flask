name: CI

# Real test gate (the other two workflows in this folder are Claude review bots,
# not a pytest run). The suite is fully mock-based — conftest.py patches the DB
# pool and every repository is mocked — so CI needs no PostgreSQL service.

on:
  push:
    branches: [invoices-app, main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-guard:
    name: Design-system guard (System-A regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Fail the build if legacy "System-A" classes (gradient buttons,
      # rounded-xl/2xl) reappear in authenticated templates. The three
      # standalone auth pages never migrated (they don't load output.css),
      # so they are excluded.
      - name: No rounded-xl / gradient classes in authenticated templates
        run: |
          if grep -rnE 'rounded-xl|rounded-2xl|from-primary-|to-primary-' templates \
               --include='*.html' \
               --exclude=login.html --exclude=forgot_password.html --exclude=reset_password.html; then
            echo "::error::System-A class reappeared in an authenticated template (see matches above). Use the flat System-B token classes."
            exit 1
          fi
          echo "Design-system guard passed: no System-A classes found."

  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage gate
        env:
          # conftest.py sets its own SECRET_KEY for the app fixture; these are
          # belt-and-suspenders for any code that reads the env before the fixture.
          # Must be >= 32 chars and not a placeholder (app.py boot validation).
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
          FLASK_ENV: development
        run: |
          pytest --cov --cov-report=term-missing --cov-fail-under=25
