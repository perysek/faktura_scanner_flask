version: '3.8'

services:
  web:
    build: .
    container_name: faktura_scanner
    ports:
      - "8083:8083"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_key_in_production}
      - FLASK_DEBUG=0
      - DB_PATH=/app/data/faktury.db
      # Tesseract/Poppler paths are already set correctly in Dockerfile for Linux
    volumes:
      # Persist Database
      - ./data:/app/data
      # Persist Uploaded Files
      - ./uploads:/app/uploads
      # Persist Processed PDFs
      - ./pdfs:/app/pdfs
    # Memory limits to prevent OOM kills (adjust based on VPS RAM)
    # For 2GB VPS: use mem_limit: 1500m
    # For 4GB VPS: use mem_limit: 3000m
    deploy:
      resources:
        limits:
          memory: 1500M
        reservations:
          memory: 512M
    # For Docker Compose v2 compatibility (non-swarm mode)
    mem_limit: 1500m
    memswap_limit: 2g
    restart: always
    # Health check to monitor worker status
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/invoices/statistics"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
