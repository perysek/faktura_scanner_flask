# issues.my-way-solutions.com — support-ticket desk (issues-admin/, branch issues-admin).
# Installed as /etc/nginx/sites-available/my-way-issues-admin (+ sites-enabled symlink).
#
# Same hardening as staging.my-way-solutions.com (my-way-react-preview-staging):
# Cloudflare-proxied DNS, Cloudflare Origin CA cert (*.my-way-solutions.com), Authenticated
# Origin Pulls armed-optional, origin 443 reachable from Cloudflare IP ranges only (ufw),
# shared security-headers snippet. Static SPA from /opt/my-way-issues/issues-admin/dist;
# /api + /auth go to the SAME Flask backend as staging (my-way-react-preview, :8085) —
# app-level auth (Flask-Login session) + the 'support_tickets' RBAC module are the gate.

# Raw port, like :8003 for the preview — closed by ufw (only 22 + CF-only 80/443 are open),
# so it is reachable on the box itself / over an SSH tunnel only.
server {
    listen 8005;
    listen [::]:8005;
    server_name _;

    client_max_body_size 16M;
    root /opt/my-way-issues/issues-admin/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(api|auth)(/|$) {
        proxy_pass         http://127.0.0.1:8085;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name issues.my-way-solutions.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client      optional;

    client_max_body_size 16M;

    include snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /opt/my-way-issues/issues-admin/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
    }
    location ~ ^/(api|auth)(/|$) {
        proxy_pass         http://127.0.0.1:8085;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location / {
        add_header Cache-Control "no-cache";
        include snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
