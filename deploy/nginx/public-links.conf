# ─────────────────────────────────────────────────────────────────────────────────────────
# Public pages that FLASK renders — put them in front of the SPA fallback.
#
# Why: on a host that serves the React build (`root …/frontend/dist;` + `try_files … /index.html`)
# the SPA fallback answers EVERY unknown path with its own shell. Confirm/cancel/rate links in
# client SMS, the employee start link, the online booking page, and the `/static` files those
# standalone pages load (css/output.css, js/mobile-app.js, Logo.png) therefore all returned the
# React "Nie znaleziono" page — HTTP 200 with the wrong content, so nothing alerted anyone.
# (SMS review P0-5; verified on staging 2026-10-06.)
#
# Apply (nothing here is applied automatically):
#   1. Copy this `location` block into the `server { … }` of the React vhost
#      (staging: /etc/nginx/sites-available/my-way-react-preview-staging), ABOVE `location /`.
#   2. Set `proxy_pass` to the SAME upstream that vhost's existing `location ^~ /api` uses.
#   3. `nginx -t && systemctl reload nginx`
#   4. python scripts/smoke_public_links.py https://<that-host>      → must print "ALL CHECKS PASSED"
#   Do NOT point BASE_URL at the React host until step 4 is green.
#
# Keep the prefix list in sync with `flaskPublicPaths` in frontend/vite.config.ts —
# tests/test_public_link_routing.py fails the build when the two differ.
#
# If a Content-Security-Policy is ever added: the booking page loads Cloudflare Turnstile, so
# allow https://challenges.cloudflare.com in script-src, frame-src and connect-src.
# ─────────────────────────────────────────────────────────────────────────────────────────

location ~ ^/(confirm|cancel|rate|visit|booking|pracownik|static)(/|$) {
    proxy_pass http://127.0.0.1:8085;            # ← match this vhost's `location ^~ /api`

    # Flask validates the Turnstile token against the Host the page was served on.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Rate limiting keys on the real visitor IP Cloudflare puts in this header; pass it through.
    proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
}
