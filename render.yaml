databases:
  - name: faktura-db
    plan: starter          # $7/month — includes automated backups
    region: frankfurt      # Closest to Poland

services:
  - type: web
    name: faktura-scanner
    runtime: python
    plan: starter          # $7/month — required for persistent disk + no sleep
    region: frankfurt
    buildCommand: |
      apt-get install -y \
        tesseract-ocr \
        tesseract-ocr-pol \
        poppler-utils \
        libgl1-mesa-glx \
        libglib2.0-0 && \
      npm install && \
      npm run build:css && \
      pip install -r requirements.txt && \
      alembic upgrade head
    startCommand: >
      gunicorn
      --workers 2
      --timeout 120
      --bind 0.0.0.0:$PORT
      "app:create_app()"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: faktura-db
          property: connectionString   # Render injects postgres:// URL automatically
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: POPPLER_PATH
        value: /usr/bin
      - key: UPLOAD_FOLDER
        value: /data/uploads
      - key: PDF_FOLDER
        value: /data/pdfs
      - key: TEMP_DIR
        value: /data/temp
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: faktura-files
      mountPath: /data
      sizeGB: 5              # Covers pdfs + uploads + temp only (db is now managed PostgreSQL)
