{% extends "base.html" %}
{% block title %}Edytuj {{ employee.full_name }} - {{ app_name }}{% endblock %}
{% block extra_css %}<style>:root{--color-ink:#1a1a1a;--color-border:#e8e6e1;--color-surface-warm:#f7f6f3}body{background:var(--color-surface-warm);font-family:Inter,sans-serif}.refined-page{max-width:800px;margin:0 auto;padding:2rem}.page-title{font-size:1.75rem;font-weight:600;margin-bottom:0.5rem}.page-subtitle{color:#525252;font-size:0.8125rem;margin-bottom:2rem}.refined-card{background:white;border:1px solid var(--color-border);border-radius:2px;padding:2rem}.form-grid{display:grid;gap:1.25rem}.form-grid-2{grid-template-columns:1fr 1fr}@media (max-width:768px){.form-grid-2{grid-template-columns:1fr}}.refined-label{display:block;font-size:0.75rem;font-weight:500;text-transform:uppercase;margin-bottom:0.5rem}.refined-input{width:100%;padding:0.625rem 1rem;font-size:0.8125rem;border:1px solid var(--color-border);border-radius:2px}.checkbox-wrapper{display:flex;gap:0.5rem;padding:0.75rem 0}.refined-checkbox{width:1.125rem;height:1.125rem}.refined-btn-primary{display:inline-flex;padding:0.625rem 1rem;font-size:0.8125rem;background:var(--color-ink);color:white;border-radius:2px;border:none;cursor:pointer;flex:1;justify-content:center}.refined-btn-secondary{display:inline-flex;padding:0.625rem 1rem;background:white;color:#525252;border-radius:2px;border:1px solid var(--color-border);text-decoration:none;justify-content:center}.form-actions{display:flex;gap:0.75rem;margin-top:1.5rem}.material-icons{font-size:1rem}</style>{% endblock %}
{% block content %}<div class="refined-page"><h1 class="page-title">Edytuj pracownika</h1><p class="page-subtitle">{{ employee.full_name }}</p><div class="refined-card"><form id="form"><div class="form-grid form-grid-2"><div><label class="refined-label">Imię *</label><input type="text" id="first_name" required class="refined-input" value="{{ employee.first_name }}"></div><div><label class="refined-label">Nazwisko *</label><input type="text" id="last_name" required class="refined-input" value="{{ employee.last_name }}"></div><div><label class="refined-label">Telefon</label><input type="tel" id="phone" class="refined-input" value="{{ employee.phone if employee.phone else '' }}"></div><div><label class="refined-label">Email</label><input type="email" id="email" class="refined-input" value="{{ employee.email if employee.email else '' }}"></div><div><label class="refined-label">Stanowisko</label><input type="text" id="position" class="refined-input" value="{{ employee.position if employee.position else '' }}"></div><div><label class="refined-label">Data zatrudnienia</label><input type="date" id="hire_date" class="refined-input" value="{{ employee.hire_date.strftime('%Y-%m-%d') if employee.hire_date else '' }}"></div></div><div class="checkbox-wrapper"><input type="checkbox" id="is_active" class="refined-checkbox" {% if employee.is_active %}checked{% endif %}><label>Pracownik aktywny</label></div><div class="form-actions"><button type="submit" class="refined-btn-primary"><span class="material-icons">save</span>Zapisz</button><a href="{{ url_for('main.view_employee', employee_id=employee.id) }}" class="refined-btn-secondary">Anuluj</a></div></form></div></div>{% endblock %}
{% block extra_scripts %}<script>document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();const d={first_name:document.getElementById('first_name').value,last_name:document.getElementById('last_name').value,phone:document.getElementById('phone').value||null,email:document.getElementById('email').value||null,position:document.getElementById('position').value||null,hire_date:document.getElementById('hire_date').value||null,is_active:document.getElementById('is_active').checked};try{const r=await fetch('/api/employees/{{ employee.id }}',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const data=await r.json();if(data.success){alert('Zmiany zapisane!');window.location.href='/employee/{{ employee.id }}';}else{alert('Błąd: '+data.error);}}catch(e){alert('Błąd połączenia');}});</script>{% endblock %}
