<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieprawidłowy link — MyWay Beauty Salon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f0;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .card {
            background: white; border-radius: 8px;
            padding: 2rem 1.5rem; max-width: 420px; width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
            text-align: center;
        }
        .salon-name { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.1em;
                      text-transform: uppercase; color: #888; margin-bottom: 1.5rem; }
        .icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .heading { font-size: 1.125rem; font-weight: 600; color: #1a1a1a; margin-bottom: 0.5rem; }
        .message { font-size: 0.875rem; color: #666; line-height: 1.6; }
    </style>
</head>
<body>
<div class="card">
    <p class="salon-name">MyWay Beauty Salon</p>
    <div class="icon">🔗</div>
    <h1 class="heading">Link wygasł lub jest nieprawidłowy</h1>
    <p class="message">Skontaktuj się z salonem, aby uzyskać nowy link do potwierdzenia wizyty.</p>
</div>
</body>
</html>
