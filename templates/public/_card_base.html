<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyWay Beauty Salon{% endblock %}</title>
    {% include 'public/_tokens.html' %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f0;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 1.5rem 1rem;
        }
        .card {
            background: var(--color-surface-elevated); border-radius: 8px;
            padding: 2.25rem 1.75rem; max-width: 420px; width: 100%;
            border: 1px solid rgba(0,0,0,.04);
            box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.09);
        }
        .salon-name {
            font-size: 0.75rem; font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; color: #888; margin-bottom: 1.75rem;
        }
        .status-view { text-align: center; }
        .heading { font-size: 1.25rem; font-weight: 600; color: #1a1a1a; line-height: 1.35; margin-bottom: 0.5rem; }
        .subheading { font-size: 0.875rem; color: #666; line-height: 1.55; margin-bottom: 1.75rem; }
        .details-block { background: #f9f9f7; border-radius: 6px; padding: 0.25rem 1.125rem; margin-bottom: 1.75rem; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 0.625rem 0; font-size: 0.875rem; }
        .detail-row + .detail-row { border-top: 1px solid rgba(0,0,0,.05); }
        .detail-label { color: #888; }
        .detail-value { font-weight: 500; color: #1a1a1a; }
        .warning-box {
            background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px;
            padding: 1rem 1.125rem; margin-bottom: 1.75rem;
            font-size: 0.8125rem; color: #92400e; line-height: 1.55;
        }
        .btn {
            display: block; width: 100%; padding: 1rem; border-radius: 6px;
            font-family: inherit; font-size: 0.9375rem; font-weight: 500; letter-spacing: 0.01em;
            text-align: center; text-decoration: none; cursor: pointer; margin-bottom: 0.75rem;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .btn-primary { background: #1a1a1a; color: #fff; border: none; }
        .btn-primary:active { background: #333; }
        .btn-danger { background: #dc2626; color: #fff; border: none; }
        .btn-danger:active { background: #b91c1c; }
        .btn-secondary {
            background: var(--color-surface-elevated); color: #666;
            border: 1px solid #ddd; font-size: 0.875rem; font-weight: 400;
        }
        .btn-secondary:active { border-color: #666; color: #1a1a1a; }
        .status-icon { font-size: 2.5rem; margin-bottom: 0.875rem; }
        .status-message {
            font-size: 0.875rem; color: #666; line-height: 1.55; margin: 0.5rem auto 1.5rem;
            max-width: 300px;
        }
        .contact-hint {
            margin-top: 1.75rem; padding-top: 1.125rem; border-top: 1px solid #f0f0f0;
            font-size: 0.75rem; color: #888; text-align: center;
        }
        .contact-hint a { color: inherit; font-weight: 500; }
        .error-msg { color: #dc2626; font-size: 0.875rem; margin-bottom: 1.25rem; }
        .toast {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            background: #1a1a1a; color: #fff; padding: 0.75rem 1.5rem; border-radius: 6px;
            font-size: 0.875rem; white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: slideup 0.3s ease;
        }
        @keyframes slideup {
            from { transform: translateX(-50%) translateY(16px); opacity: 0; }
            to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
        }
    </style>
</head>
<body>
<div class="card">
    <p class="salon-name">MyWay Beauty Salon</p>
    {% block card %}{% endblock %}
</div>
</body>
</html>
