<!-- Confirmation Modal Component -->
<div id="confirm-modal" class="fixed inset-0 z-[9999] hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Backdrop with blur -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-all duration-200 opacity-0"
         id="confirm-modal-backdrop" onclick="closeConfirmModal()"></div>

    <!-- Modal Panel Container -->
    <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
        <div class="relative bg-white rounded-2xl shadow-2xl max-w-md w-full transform transition-all duration-200 scale-95 opacity-0 pointer-events-auto"
             id="confirm-modal-panel"
             style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.05);">

            <!-- Header with Icon -->
            <div class="px-6 pt-6 pb-4">
                <div class="flex items-start gap-4">
                    <!-- Dynamic Icon Container -->
                    <div id="confirm-modal-icon" class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 bg-red-100">
                        <svg class="w-6 h-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-lg font-semibold text-slate-800 leading-tight" id="confirm-modal-title">Potwierdź akcję</h3>
                        <p class="text-sm text-slate-500 mt-2 leading-relaxed" id="confirm-modal-message">Czy na pewno chcesz kontynuować?</p>
                    </div>
                    <!-- Close X Button -->
                    <button type="button" onclick="closeConfirmModal()"
                            class="text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg p-1 transition-colors -mt-1 -mr-1">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Actions Footer -->
            <div class="px-6 pb-6 pt-2 flex items-center justify-end gap-3 bg-slate-50/80 rounded-b-2xl border-t border-slate-100">
                <button type="button" onclick="closeConfirmModal()"
                        class="px-5 py-2.5 text-sm font-medium text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 hover:border-slate-400 rounded-xl transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-1 active:scale-[0.98]">
                    Anuluj
                </button>
                <button type="button" id="confirm-modal-submit-btn"
                        class="px-5 py-2.5 text-sm font-medium text-white bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 rounded-xl shadow-md shadow-red-500/25 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-1 active:scale-[0.98]">
                    Potwierdź
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let confirmModalTargetForm = null;
    let confirmModalCallback = null;

    /**
     * Show confirmation modal
     * @param {HTMLFormElement|null} form - Form to submit on confirm (optional)
     * @param {string} title - Modal title
     * @param {string} message - Modal message
     * @param {string} confirmBtnText - Confirm button text
     * @param {string} type - Modal type: 'danger', 'warning', 'info' (affects icon/button color)
     * @param {Function} callback - Optional callback function instead of form submit
     */
    function showConfirmModal(form, title, message, confirmBtnText = 'Potwierdź', type = 'danger', callback = null) {
        confirmModalTargetForm = form;
        confirmModalCallback = callback;

        const modal = document.getElementById('confirm-modal');
        const backdrop = document.getElementById('confirm-modal-backdrop');
        const panel = document.getElementById('confirm-modal-panel');
        const titleEl = document.getElementById('confirm-modal-title');
        const messageEl = document.getElementById('confirm-modal-message');
        const submitBtn = document.getElementById('confirm-modal-submit-btn');
        const iconContainer = document.getElementById('confirm-modal-icon');

        // Set content
        if (title) titleEl.textContent = title;
        if (message) messageEl.textContent = message;
        if (confirmBtnText) submitBtn.textContent = confirmBtnText;

        // Update styling based on type
        const typeStyles = {
            danger: {
                iconBg: 'bg-red-100',
                iconColor: 'text-red-600',
                btnClass: 'bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 shadow-red-500/25 focus:ring-red-500',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />'
            },
            warning: {
                iconBg: 'bg-amber-100',
                iconColor: 'text-amber-600',
                btnClass: 'bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 shadow-amber-500/25 focus:ring-amber-500',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />'
            },
            info: {
                iconBg: 'bg-blue-100',
                iconColor: 'text-blue-600',
                btnClass: 'bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 shadow-blue-500/25 focus:ring-blue-500',
                icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />'
            }
        };

        const style = typeStyles[type] || typeStyles.danger;

        // Update icon container
        iconContainer.className = `w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 ${style.iconBg}`;
        iconContainer.innerHTML = `<svg class="w-6 h-6 ${style.iconColor}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">${style.icon}</svg>`;

        // Update button styling
        submitBtn.className = `px-5 py-2.5 text-sm font-medium text-white ${style.btnClass} rounded-xl shadow-md transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-1 active:scale-[0.98]`;

        // Prevent body scroll
        document.body.style.overflow = 'hidden';

        // Show modal
        modal.classList.remove('hidden');

        // Trigger animations after display change
        requestAnimationFrame(() => {
            backdrop.classList.remove('opacity-0');
            backdrop.classList.add('opacity-100');
            panel.classList.remove('scale-95', 'opacity-0');
            panel.classList.add('scale-100', 'opacity-100');
        });

        // Focus the cancel button for accessibility
        setTimeout(() => {
            const cancelBtn = panel.querySelector('button[onclick="closeConfirmModal()"]');
            if (cancelBtn) cancelBtn.focus();
        }, 100);

        // Bind submit handler
        submitBtn.onclick = function() {
            if (confirmModalCallback) {
                confirmModalCallback();
            } else if (confirmModalTargetForm) {
                confirmModalTargetForm.submit();
            }
            closeConfirmModal();
        };
    }

    function closeConfirmModal() {
        const modal = document.getElementById('confirm-modal');
        const backdrop = document.getElementById('confirm-modal-backdrop');
        const panel = document.getElementById('confirm-modal-panel');

        // Animate out
        backdrop.classList.remove('opacity-100');
        backdrop.classList.add('opacity-0');
        panel.classList.remove('scale-100', 'opacity-100');
        panel.classList.add('scale-95', 'opacity-0');

        // Hide after animation and restore body scroll
        setTimeout(() => {
            modal.classList.add('hidden');
            document.body.style.overflow = '';
            confirmModalTargetForm = null;
            confirmModalCallback = null;
        }, 200);
    }

    // Global helper for delete forms
    function confirmDelete(form, itemName) {
        showConfirmModal(
            form,
            'Potwierdź usunięcie',
            `Czy na pewno chcesz usunąć "${itemName}"? Ta operacja jest nieodwracalna.`,
            'Usuń',
            'danger'
        );
        return false;
    }

    // Close on Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const modal = document.getElementById('confirm-modal');
            if (modal && !modal.classList.contains('hidden')) {
                closeConfirmModal();
            }
        }
    });
</script>
