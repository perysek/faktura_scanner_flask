<!-- Confirmation Modal Component -->
<div id="confirm-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity opacity-0" 
         id="confirm-modal-backdrop" onclick="closeConfirmModal()"></div>
    
    <!-- Modal Panel -->
    <div class="absolute inset-0 flex items-center justify-center p-4">
        <div class="relative bg-white rounded-2xl shadow-2xl max-w-md w-full transform transition-all scale-95 opacity-0" 
             id="confirm-modal-panel">
            <!-- Header -->
            <div class="px-6 pt-6 pb-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-red-100 flex-shrink-0">
                        <svg class="w-6 h-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-slate-800" id="confirm-modal-title">Potwierdź akcję</h3>
                        <p class="text-sm text-slate-500 mt-1" id="confirm-modal-message">Czy na pewno chcesz kontynuować?</p>
                    </div>
                </div>
            </div>
            
            <!-- Actions -->
            <div class="px-6 pb-6 pt-2 flex items-center justify-end gap-3 bg-gray-50/50 rounded-b-2xl">
                <button type="button" onclick="closeConfirmModal()"
                        class="px-5 py-2.5 text-sm font-medium text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 rounded-xl transition-colors focus:ring-2 focus:ring-slate-200">
                    Anuluj
                </button>
                <button type="button" id="confirm-modal-submit-btn"
                        class="px-5 py-2.5 text-sm font-medium text-white bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 rounded-xl shadow-sm transition-all focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                    Potwierdź
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let confirmModalTargetForm = null;

    function showConfirmModal(form, title, message, confirmBtnText = 'Potwierdź') {
        confirmModalTargetForm = form;
        
        const modal = document.getElementById('confirm-modal');
        const backdrop = document.getElementById('confirm-modal-backdrop');
        const panel = document.getElementById('confirm-modal-panel');
        const titleEl = document.getElementById('confirm-modal-title');
        const messageEl = document.getElementById('confirm-modal-message');
        const submitBtn = document.getElementById('confirm-modal-submit-btn');

        if (title) titleEl.textContent = title;
        if (message) messageEl.textContent = message;
        if (confirmBtnText) submitBtn.textContent = confirmBtnText;

        // Show modal
        modal.classList.remove('hidden');
        
        // Animate in (small delay to allow display:block to apply)
        setTimeout(() => {
            backdrop.classList.remove('opacity-0');
            panel.classList.remove('scale-95', 'opacity-0');
            panel.classList.add('scale-100', 'opacity-100');
        }, 10);

        // Bind submit
        submitBtn.onclick = function() {
            if (confirmModalTargetForm) {
                confirmModalTargetForm.submit();
            }
            closeConfirmModal();
        };
    }

    function closeConfirmModal() {
        const modal = document.getElementById('confirm-modal');
        const backdrop = document.getElementById('confirm-modal-backdrop');
        const panel = document.getElementById('confirm-modal-panel');

        // Animate out
        backdrop.classList.add('opacity-0');
        panel.classList.remove('scale-100', 'opacity-100');
        panel.classList.add('scale-95', 'opacity-0');

        // Hide after animation
        setTimeout(() => {
            modal.classList.add('hidden');
            confirmModalTargetForm = null;
        }, 300);
    }
    
    // Global helper for delete forms
    function confirmDelete(form, itemName) {
        showConfirmModal(
            form,
            'Potwierdź usunięcie',
            `Czy na pewno chcesz usunąć "${itemName}"? Ta operacja jest nieodwracalna.`,
            'Usuń'
        );
        return false;
    }
</script>
